name: APK e AAB do receptor Android

# Roda em paralelo ao deploy, só quando o app muda. O APK assinado fica sempre no mesmo endereço
# (release "receptor"), usado pelo link da página inicial. O AAB da Play Store fica como artefato
# da execução (não é público). Nada disso toca a VPS.

"on":
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simvio-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Testar e gerar APK e AAB assinados
        env:
          SIMVIO_KEYSTORE_BASE64: ${{ secrets.SIMVIO_KEYSTORE_BASE64 }}
          SIMVIO_KEYSTORE_PASSWORD: ${{ secrets.SIMVIO_KEYSTORE_PASSWORD }}
          SIMVIO_KEY_PASSWORD: ${{ secrets.SIMVIO_KEYSTORE_PASSWORD }}
          SIMVIO_KEY_ALIAS: simvio
          SIMVIO_VERSION_CODE: ${{ github.run_number }}
        run: |
          export SIMVIO_KEYSTORE_FILE="$RUNNER_TEMP/simvio-release.jks"
          printf '%s' "$SIMVIO_KEYSTORE_BASE64" | base64 -d > "$SIMVIO_KEYSTORE_FILE"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease bundleRelease
          tools=("$ANDROID_HOME"/build-tools/*)
          "${tools[-1]}/apksigner" verify app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk simvio-receptor.apk
          cp app/build/outputs/bundle/release/app-release.aab simvio-receptor-$SIMVIO_VERSION_CODE.aab

      - name: Guardar o AAB para a Play Store
        uses: actions/upload-artifact@v4
        with:
          name: simvio-receptor-aab
          path: apps/android/simvio-receptor-*.aab
          retention-days: 30

      - name: Publicar no endereço fixo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view receptor >/dev/null 2>&1 || gh release create receptor \
            --title "App receptor Android" --notes "Versão mais recente do app receptor do Simvio." --latest=false
          gh release upload receptor simvio-receptor.apk --clobber
