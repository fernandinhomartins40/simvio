# EXEMPLO — vhost HTTPS para um Nginx CENTRAL já existente na VPS.
# Não substitui nenhuma configuração existente: copie para um arquivo NOVO
# (ex.: /etc/nginx/sites-available/simvio.conf), ajuste domínio/certificado,
# rode `nginx -t` e só então recarregue. A Simvio escuta apenas em 127.0.0.1:SIMVIO_PORT
# (padrão 8080, definido no .env da Simvio).

server {
    listen 80;
    listen [::]:80;
    server_name simvio.exemplo.com.br;

    # Validação do Let's Encrypt (ajuste ao método já usado na VPS) e redirecionamento para HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name simvio.exemplo.com.br;

    ssl_certificate     /etc/letsencrypt/live/simvio.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simvio.exemplo.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:simvio_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Logs do proxy central sem query string e sem caminho com token (/v/<token>).
    # Se o log_format do servidor central registra $request completo, prefira desligar aqui:
    access_log off;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;   # = SIMVIO_PORT
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
