# Nginx central da VPS -> Simvio (127.0.0.1:8290). Instalado em /etc/nginx/sites-available/simvio.
# Sem access_log aqui: as URLs /v/<token> só são registradas, mascaradas, pelo Nginx da própria Simvio.

server {
    listen 80;
    server_name simvio.com.br www.simvio.com.br;
    access_log off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://simvio.com.br$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.simvio.com.br;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/simvio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simvio.com.br/privkey.pem;
    return 301 https://simvio.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name simvio.com.br;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/simvio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simvio.com.br/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8290;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
